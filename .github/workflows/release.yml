name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Clean previous bundle artifacts
        shell: pwsh
        run: |
          $bundleDir = "apps/desktop/src-tauri/target/release/bundle"
          if (Test-Path $bundleDir) {
            Remove-Item -LiteralPath $bundleDir -Recurse -Force
          }

      - name: Build Tauri app
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Generate installer SHA256 checksums
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem `
            "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe"
          $sumFile = "apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt"
          if (Test-Path $sumFile) { Remove-Item -LiteralPath $sumFile -Force }
          $artifacts | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath "$($_.FullName).sha256" -Value "$hash  $($_.Name)"
            Add-Content -LiteralPath $sumFile -Value "$hash  $($_.Name)"
          }

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sha256
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
